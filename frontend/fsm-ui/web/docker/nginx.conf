server
{
  listen 80;
  underscores_in_headers on;

  location /fsm-ui/citizen/fsm-home
  {
    root /var/web;
    index index.html index.htm;
    try_files $uri $uri/ /fsm-ui/index.html;
  }
  location /digit-ui
  {
    root /var/web;
    index index.html index.htm;
    try_files $uri $uri/ /fsm-ui/index.html;
  }  
}